<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website layout review</title><style>body{margin:0;background:#e8e9ec;font:14px system-ui}nav{padding:12px;display:flex;gap:10px;align-items:center}button{border:1px solid #bbb;background:white;border-radius:5px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#222;color:white}#stage{display:flex;justify-content:center;align-items:flex-start;width:100%;overflow:visible}iframe{border:0;flex:none;background:#f8f8f5;transform-origin:top center}</style></head><body><nav aria-label="Viewport"><strong>Layout review</strong><button aria-pressed="true" data-width="1440" data-height="1000">MacBook 1440</button><button aria-pressed="false" data-width="1280" data-height="950">MacBook 1280</button><button aria-pressed="false" data-width="1024" data-height="950">Desktop 1024</button><button aria-pressed="false" data-width="390" data-height="1250">Mobile 390</button><button aria-pressed="false" data-width="320" data-height="1250">Mobile 320</button><span id="current" role="status"></span></nav><div id="stage"><iframe title="Website preview" src="/leistungen/websites" width="1440" height="1000"></iframe></div><script>const frame=document.querySelector('iframe');function size(w,h){frame.width=w;frame.height=h;const scale=Math.min(1,(innerWidth-40)/w);frame.style.transform=`scale(${scale})`;document.getElementById('stage').style.height=(h*scale)+'px';document.getElementById('current').textContent=w+' × '+h;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.width===w)))}document.querySelectorAll('button').forEach(b=>b.onclick=()=>size(+b.dataset.width,+b.dataset.height));addEventListener('resize',()=>size(+frame.width,+frame.height));size(1440,1000);</script></body></html>
